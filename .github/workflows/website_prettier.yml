name: Check Website Code Style

on:
  pull_request:
    paths:
      - "ankidroid.org/**"
      - ".github/workflows/website_prettier.yml"
  push:
    branches:
      - main
    paths:
      - "ankidroid.org/**"
      - ".github/workflows/website_prettier.yml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ankidroid.org
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Prettier
        run: npm install --global prettier@3.6.2

      - name: Run Prettier
        run: prettier --check "**/*.{html,css,js,json}"
